<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Startline</title>
  <!--
    Shown when the live site can't be reached (server.errorPath in
    capacitor.config.ts). Self-contained on purpose: no network, no fonts.
  -->
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #141414; color: #F2F2F2; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 320px; }
    .mark {
      font-weight: 800; font-style: italic; text-transform: uppercase;
      letter-spacing: 0.12em; font-size: 22px; color: #B3E153; margin-bottom: 24px;
    }
    h1 { font-size: 18px; text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #A3A3A3; margin: 0 0 28px; }
    button {
      background: #B3E153; color: #141414; border: 0; border-radius: 6px;
      font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 14px 28px; box-shadow: 2px 2px 0 #B3E153; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">Startline</div>
    <h1>You're offline</h1>
    <p>Startline needs a connection to load events. Check your signal or Wi-Fi and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
