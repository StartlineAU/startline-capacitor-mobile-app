name: Android

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PR builds read no secrets: anything a PR workflow can read, unmerged PR code
# can read. Signing and Play upload run only on main, and only once the
# ANDROID_RELEASE_ENABLED repo variable is "true" (after the Play Console app
# and upload key exist). See README -> Releases.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # PRs build against staging; the store build below re-syncs for prod.
      - run: pnpm sync:staging
      - name: Debug build
        working-directory: android
        run: ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: startline-staging-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ANDROID_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: play-internal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:${{ vars.ANDROID_RELEASE_ENV || 'staging' }}
      - name: Write the upload keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Signed release bundle
        working-directory: android
        run: ./gradlew bundleRelease --console=plain
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload to the Play internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.startlineau.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
