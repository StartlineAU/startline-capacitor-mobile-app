name: iOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# iOS can only be built on macOS, and development happens on Windows, so this
# runner is the iOS build machine. PRs compile for the simulator with no
# signing and no secrets. TestFlight uploads run only on main, once the
# IOS_RELEASE_ENABLED repo variable is "true" (Apple Developer account, App
# Store Connect app record and API key in place). See README -> Releases.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:staging
      - name: Simulator build (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40

  testflight:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.IOS_RELEASE_ENABLED == 'true'
    runs-on: macos-15
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync:${{ vars.IOS_RELEASE_ENV || 'staging' }}
      - name: Build and upload to TestFlight
        run: fastlane ios beta
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
